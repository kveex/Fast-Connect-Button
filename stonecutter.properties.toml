mod.sources_url = "https://github.com/kveex/Fast-Connect-Button"
mod.homepage_url = "https://github.com/kveex/Fast-Connect-Button"
mod.issues_url = "https://github.com/kveex/Fast-Connect-Button/issues"
mod.discord_url = ""
mod.environment = "client_only"
