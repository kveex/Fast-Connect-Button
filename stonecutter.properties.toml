mod.id = "fast_connect_button"
mod.name = "Fast Connect Button"
mod.group = "me.kveex"
mod.version = "1.2.0"
mod.channel_tag = ""
mod.description = "A small mod that adds a customizable button to the home screen that allows you to log in to a specified server with a single click"
mod.authors = ["kveex"]
mod.contributors = []
mod.inception_year = "2026"
mod.license.name = "MIT"
mod.license.url = "https://opensource.org/licenses/MIT"
